name: Sync AWS Pricing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync AWS prices
        run: npm run sync-prices

      - name: Commit updated pricing data
        run: |
          if git diff --quiet -- public/pricing/aws-prices.json; then
            echo "Pricing data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pricing/aws-prices.json
          git commit -m "chore: sync AWS pricing data"
          git push
